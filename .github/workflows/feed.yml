name: Build OSRS brief feed
# Fetches our model output + OSRS news + Reddit (all public) into feed/latest.json,
# which the daily cloud agent clones and reads. Runs an hour before the 23:00 UTC
# brief, plus on-demand. Uses only the built-in GITHUB_TOKEN to commit — no secrets.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build feed
        run: node fetch_feed.mjs
      - name: Commit feed
        run: |
          git config user.name 'osrs-brief-bot'
          git config user.email 'actions@github.com'
          git add feed/latest.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "feed: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
